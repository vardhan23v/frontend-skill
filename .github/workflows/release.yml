name: Release

# Push a tag like v4.0.0 (matching metadata.version in SKILL.md) to publish a GitHub release
# with the skill folder zipped and the matching CHANGELOG section as the notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate before releasing
        run: node .github/scripts/validate-skill.js

      - name: Tag must match metadata.version
        id: version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^  version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' create-frontend/SKILL.md | head -1)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match metadata.version $version in SKILL.md" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package the skill folder
        run: |
          set -eu
          zip -r "create-frontend-v${{ steps.version.outputs.version }}.zip" create-frontend LICENSE -x '*.DS_Store'
          unzip -l "create-frontend-v${{ steps.version.outputs.version }}.zip"

      - name: Release notes from CHANGELOG
        run: |
          set -eu
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          {
            echo
            echo "Install: unzip, then run \`create-frontend/scripts/install.sh agents claude\` (or copy \`create-frontend/\` into your agent's skills directory)."
          } >> notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "create-frontend-v${{ steps.version.outputs.version }}.zip" \
            --title "create-frontend ${{ steps.version.outputs.version }}" \
            --notes-file notes.md
